// ─── GRADE SYSTEM ─────────────────────────────────────────────────────────────
const getGrade = (score) => {
  if (score >= 9.0) return { letter:"A+", label:"Outstanding",    color:"#22c55e", bg:"rgba(34,197,94,0.12)",  emoji:"🌿" };
  if (score >= 8.0) return { letter:"A",  label:"Excellent",      color:"#4ade80", bg:"rgba(74,222,128,0.10)", emoji:"🍃" };
  if (score >= 7.0) return { letter:"B+", label:"Very Good",      color:"#a3e635", bg:"rgba(163,230,53,0.10)", emoji:"🌱" };
  if (score >= 6.0) return { letter:"B",  label:"Good",           color:"#facc15", bg:"rgba(250,204,21,0.10)", emoji:"☀️" };
  if (score >= 5.0) return { letter:"C+", label:"Developing",     color:"#fb923c", bg:"rgba(251,146,60,0.10)", emoji:"🌤️" };
  if (score >= 4.0) return { letter:"C",  label:"Fair",           color:"#f97316", bg:"rgba(249,115,22,0.10)", emoji:"⛅" };
  if (score >= 3.0) return { letter:"D",  label:"Needs Work",     color:"#ef4444", bg:"rgba(239,68,68,0.10)",  emoji:"🔥" };
  return             { letter:"E",  label:"Getting Started", color:"#dc2626", bg:"rgba(220,38,38,0.10)",  emoji:"💡" };
};

const getOverallMsg = (s) => {
  if (s>=9.0) return "Extraordinary! You're a genuine sustainability champion — your habits make a real, measurable difference every single day.";
  if (s>=8.0) return "Excellent work! You're living with real environmental awareness. A few more steps and you'll be at the very top.";
  if (s>=7.0) return "Really well done! You've built strong eco habits across most areas — keep going, you're so close to excellent.";
  if (s>=6.0) return "Good effort! You're doing better than most. There are clear opportunities to take your impact to the next level.";
  if (s>=5.0) return "A decent start. You've got some good habits but several areas could use attention — small changes add up fast.";
  if (s>=4.0) return "You're on the journey. There's real room to grow across multiple areas — but every improvement counts.";
  if (s>=3.0) return "There's quite a bit of room to improve — picking just one area to focus on can make a big difference.";
  return "Every journey starts with a single step. Use the tips below to find the easiest wins for you right now.";
};

const getTips = (catId, score) => {
  const pool = TIPS[catId];
  if (!pool) return { great:[], improve:[] };
  if (score >= 7) return { great: pool.great, improve: [] };
  const count = score >= 5 ? 3 : score >= 3 ? 4 : 5;
  return { great: [], improve: pool.improve.filter(t=>score<t.th).slice(0,count).map(t=>t.t) };
};

// ─── CONDITIONAL LOGIC ────────────────────────────────────────────────────────
// Returns {locked: bool, reason: string} for a given question based on current answers
const getQuestionLock = (catId, qId, answers) => {
  const ans = answers[catId] || {};

  // Heating: if "I don't use heating" → lock power tariff and timer
  if (catId === "heating") {
    if ((qId === "power" || qId === "timer") && ans.source === 10) {
      // score 10 = "I don't use heating"
      return { locked: true, reason: "Not applicable — you selected that you don't use heating." };
    }
  }

  // Vehicle: if "I don't drive" (score 10) → lock mileage and manufacture year
  if (catId === "vehicle") {
    if ((qId === "mileage" || qId === "mfr_year") && ans.type === 10) {
      return { locked: true, reason: "Not applicable — you don't drive.", autoScore: 9 };
    }
  }

  return { locked: false };
};

// Returns true if a specific OPTION within a multi or single question should be greyed
// based on other answers in the same category
const isOptionDisabled = (catId, qId, optLabel, optScore, answers) => {
  const ans = answers[catId] || {};

  // ── VEHICLE SECTION ──────────────────────────────────────────────────────
  if (catId === "vehicle") {
    const vehicleType = ans.type; // score of selected vehicle type option
    const NO_CAR = 10;      // "I don't drive / don't own a car"
    const EV = 9;           // Fully electric
    const PHEV = 7;         // Plug-in hybrid
    const HYBRID = 6;       // Standard hybrid
    const PETROL = 4;
    const DIESEL = 3;
    const VAN = 1;

    // Mileage & year — lock ALL options when no car (whole question locked via getQuestionLock)
    if ((qId === "mileage" || qId === "mfr_year") && vehicleType === NO_CAR) {
      return true;
    }

    // Manufacture year — EV: can't be before 2011 (Nissan Leaf first UK EV 2011)
    if (qId === "mfr_year" && vehicleType === EV) {
      const preEVOptions = [
        "2006–2010 (Euro 4, high emissions, ULEZ non-compliant)",
        "Before 2006 (Euro 1–3, very high emissions)",
        // Also disable pre-2011 within 2011–2014 band? No — 2011 is IN that band so keep it
      ];
      if (preEVOptions.includes(optLabel)) return true;
    }

    // Manufacture year — PHEV: can't be before 2012 (first PHEVs UK 2012)
    if (qId === "mfr_year" && vehicleType === PHEV) {
      const prePHEVOptions = [
        "2006–2010 (Euro 4, high emissions, ULEZ non-compliant)",
        "Before 2006 (Euro 1–3, very high emissions)",
      ];
      if (prePHEVOptions.includes(optLabel)) return true;
    }

    // Manufacture year — Standard hybrid: can't be before 2000 (Prius arrived UK 2000)
    // Before 2006 band predates mass-market hybrids — disable it
    if (qId === "mfr_year" && vehicleType === HYBRID) {
      if (optLabel === "Before 2006 (Euro 1–3, very high emissions)") return true;
    }

    // Manufacture year — Petrol/Diesel/Van: all years valid, no restrictions

    // Manufacture year — 2026 "Euro 7" option only valid for EV, PHEV, Hybrid, or petrol/diesel
    // manufactured this year (all valid), so no restriction needed here

    // Mileage — if no car selected as type, "I don't drive" on mileage is the only valid option
    // (handled above). For drivers, all mileage options valid.
  }

  // ── WASTE SECTION ────────────────────────────────────────────────────────
  if (catId === "waste" && qId === "streams") {
    const sel = ans.streams || [];
    const generalWasteLabel = "🗑️ General waste bin only — I don't separate anything";
    const generalSelected = sel.some(o => o.label === generalWasteLabel);
    const recyclingSelected = sel.some(o => o.label !== generalWasteLabel);
    if (generalSelected && optLabel !== generalWasteLabel) return true;
    if (recyclingSelected && optLabel === generalWasteLabel) return true;
  }

  // ── GREEN ACTIONS SECTION ────────────────────────────────────────────────
  if (catId === "actions" && qId === "extras") {
    const sel = ans.extras || [];
    if (sel.some(o => o.label === "None of the above") && optLabel !== "None of the above") return true;
    if (sel.length > 0 && !sel.some(o => o.label === "None of the above") && optLabel === "None of the above") return true;
  }

  // ── LIGHTING SECTION ─────────────────────────────────────────────────────
  // If "All LED bulbs throughout the home" selected → "Mostly LED" is redundant
  if (catId === "heating" && qId === "lighting" && ans.lighting === 10) {
    if (optScore === 7) return true;
  }

  return false;
};

// ─── SCORE ────────────────────────────────────────────────────────────────────
const computeCatScore = (cat, answers) => {
  const ans = answers[cat.id] || {};
  const vals = cat.questions.map(q => {
    const lockInfo = getQuestionLock(cat.id, q.id, answers);
    // Locked questions (N/A) score 10 — not penalised for things beyond their control
    if(lockInfo.locked) return lockInfo.autoScore !== undefined ? lockInfo.autoScore : 10;
    const a = ans[q.id];
    if (q.type==="single") return a??0;
    const nL=["None of the above","🗑️ General waste bin only — I don't separate anything"];
    if(!Array.isArray(a)||a.length===0||a.some(o=>nL.includes(o.label))) return 0;
    return Math.min(10,(a.reduce((s,o)=>s+o.score,0)/(q.maxScore||10))*10);
  });
  return vals.reduce((s,v)=>s+v,0)/vals.length;
};

// ─── DOWNLOAD / EXPORT HANDLER ────────────────────────────────────────────────
const handleDownload = (format, scores, overallAvg, og, categories, email, setPhase) => {

  const getTipsLocal = (catId, score) => {
    const pool = TIPS[catId];
    if (!pool) return { great:[], improve:[] };
    if (score >= 7) return { great: pool.great, improve: [] };
    const count = score >= 5 ? 3 : score >= 3 ? 4 : 5;
    return { great: [], improve: pool.improve.filter(t=>score<t.th).slice(0,count).map(t=>t.t) };
  };

  const triggerDownload = (filename, fileContent, mimeType) => {
    const blob = new Blob([fileContent], { type: mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
  };

  const date = new Date().toLocaleDateString('en-GB');
  const vals = Object.values(scores);
  const overall = vals.reduce((a,b)=>a+b,0)/vals.length;

  // ── EMAIL ──────────────────────────────────────────────────────────────────
  if (format === 'email') {
    setPhase('email_prompt_yes');
    return;
  }

  // ── CSV ────────────────────────────────────────────────────────────────────
  if (format === 'csv') {
    const rows = [
      ['Eco Self-Survey Results', date],
      [''],
      ['Category', 'Score (/10)', 'Grade', 'Label'],
      ...categories.map(c => {
        const s = scores[c.id] || 0;
        const g = getGrade(s);
        return [c.label, s.toFixed(1), g.letter, g.label];
      }),
      [''],
      ['OVERALL', overall.toFixed(1), og.letter, og.label],
      [''],
      ['Category', 'Tips'],
      ...categories.flatMap(c => {
        const s = scores[c.id] || 0;
        const { great, improve } = getTipsLocal(c.id, s);
        const tips = great.length ? great : improve;
        return tips.map((t, i) => [i === 0 ? c.label : '', t]);
      }),
    ];
    const csv = rows.map(r => r.map(cell => `"${String(cell).replace(/"/g,'""')}"`).join(',')).join('\n');
    triggerDownload('eco-survey-results.csv', csv, 'text/csv;charset=utf-8;');
    return;
  }

  // ── TEXT ───────────────────────────────────────────────────────────────────
  if (format === 'txt') {

    txt += `Overall Grade: ${og.letter} — ${og.label} (${overall.toFixed(1)}/10)\n\n`;

      txt += `\n`;

    txt += `${'='.repeat(42)}\n`;
    txt += `Generated by Eco Self-Survey · ${date}\n`;
    txt += `Small changes, consistently applied, make a real and lasting difference. 🌿\n`;
    triggerDownload('eco-survey-results.txt', txt, 'text/plain;charset=utf-8;');

const scrollTop = () => window.scrollTo({top:0,behavior:"smooth"});

// Scroll so the next question appears at the very top of the viewport
const scrollToQuestion = (qIndex) => {
  setTimeout(() => {
    const el = document.getElementById("question-" + qIndex);
    if (el) {
      // Get the element's position relative to the document (not viewport)
      let top = 0;
      let node = el;
      while (node) {
        top += node.offsetTop || 0;
        node = node.offsetParent;
      }
      // Scroll so the question sits right at the top with just a little breathing room
      window.scrollTo({ top: top - 16, behavior: "smooth" });
    }
  }, 100);
};

// ─── MAIN ─────────────────────────────────────────────────────────────────────
function EcoSurvey() {
  // phases: email | survey | results | email_prompt | emailing | done_email | no_email | closed
  const [phase,setPhase]           = useState("email");
  const [email,setEmail]           = useState("");
  const [emailErr,setEmailErr]     = useState("");
  const [catIndex,setCatIndex]     = useState(0);
  const [answers,setAnswers]       = useState({});
  const [scores,setScores]         = useState({});
  const [fading,setFading]         = useState(false);
  const [okChecked,setOkChecked]   = useState(false);
  const [sending,setSending]       = useState(false);
  const topRef = useRef(null);

  const cat        = categories[catIndex];
  const catAnswers = answers[cat?.id]||{};
  const isLast     = catIndex===categories.length-1;

  const allAnswered = cat?.questions.every(q=>{
    const lockInfo = getQuestionLock(cat.id, q.id, answers);
    // Locked questions are automatically satisfied
    if(lockInfo.locked) return true;
    const a=catAnswers[q.id];
    return q.type==="multi"?Array.isArray(a)&&a.length>0:a!==undefined;
  });

  // Scroll to top of page on every phase/page change
  useEffect(()=>{
    scrollTop();
    if(topRef.current) topRef.current.scrollIntoView({behavior:"smooth"});
  },[phase,catIndex]);

  const setSingle=(cId,qId,score,qIndex,totalQ)=>{
    setAnswers(p=>({...p,[cId]:{...(p[cId]||{}),[qId]:score}}));
    // Scroll to next question if there is one
    if(qIndex !== undefined && qIndex < totalQ - 1) {
      scrollToQuestion(qIndex + 1);
    }
  };

  const toggleMulti=(cId,qId,opt,qIndex,totalQ)=>{
    const prev=answers[cId]?.[qId]||[];
    const nL=["None of the above","🗑️ General waste bin only — I don't separate anything"];
    const wasEmpty = prev.length === 0;
    if(nL.includes(opt.label)){
      setAnswers(p=>({...p,[cId]:{...(p[cId]||{}),[qId]:prev.some(o=>o.label===opt.label)?[]:[opt]}}));
      // Scroll to next question when none/general selected (it's a definitive answer)
      if(qIndex !== undefined && qIndex < totalQ - 1) scrollToQuestion(qIndex + 1);
      return;
    }
    const filtered=prev.filter(o=>!nL.includes(o.label));
    const exists=filtered.some(o=>o.label===opt.label);
    setAnswers(p=>({...p,[cId]:{...(p[cId]||{}),[qId]:exists?filtered.filter(o=>o.label!==opt.label):[...filtered,opt]}}));
    // For multi-select, scroll to next question on FIRST selection only
    if(wasEmpty && qIndex !== undefined && qIndex < totalQ - 1) scrollToQuestion(qIndex + 1);
  };

  const goNext=()=>{
    const s=computeCatScore(cat,answers);
    setScores(p=>({...p,[cat.id]:s}));
    setFading(true);
    setTimeout(()=>{setCatIndex(i=>i+1);setFading(false);},280);
  };

  const goBack=()=>{
    setFading(true);
    setTimeout(()=>{setCatIndex(i=>i-1);setFading(false);},200);
  };

  const handleSubmit=()=>{
    const s=computeCatScore(cat,answers);
    setScores(p=>({...p,[cat.id]:s}));
    setPhase("results");
  };

  const sendEmail=async(finalScores)=>{
    setSending(true);
    try{
      const html=buildEmailHTML(finalScores,categories);
      const vals=Object.values(finalScores);
      const overall=vals.reduce((a,b)=>a+b,0)/vals.length;
      const og=getGrade(overall);

            <p style={{textAlign:"center",color:"#4a7c5a",fontSize:"0.75rem",marginTop:"1rem",lineHeight:1.6}}>
              You can download multiple formats — each tap saves a separate file to your device.
            </p>
          </div>
        </div>
      </div>
      <style>{`@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}`}</style>
    </div>
  );

  // ── YES: SEND EMAIL ──
  if(phase==="email_prompt_yes") return(
    <div style={{...BG,display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh"}}>
      <div ref={topRef}/>
      <div style={{textAlign:"center",padding:"3rem 2rem",animation:"rise 0.6s ease",maxWidth:440,margin:"0 auto"}}>
        {!sending&&!scores._sent?(
          <>
            <div style={{fontSize:"2.5rem",marginBottom:"1rem"}}>📧</div>
            <h2 style={{color:"#a8d5a2",fontWeight:"normal",fontSize:"clamp(1.1rem,3vw,1.4rem)",margin:"0 0 0.75rem"}}>Sending your results to</h2>
            <div style={{color:"#4caf50",fontSize:"clamp(0.9rem,2.5vw,1.1rem)",marginBottom:"1.5rem",wordBreak:"break-all"}}>{email}</div>
            <div style={{display:"flex",justifyContent:"center",gap:"0.4rem",marginBottom:"0.5rem"}}>
              {[0,1,2].map(i=><div key={i} style={{width:10,height:10,borderRadius:"50%",background:"#4caf50",animation:`pulse 1s ease ${i*0.2}s infinite`}}/>)}
            </div>
            <p style={{color:"#78b87a",fontSize:"0.85rem"}}>Sending…</p>
            {!sending&&(()=>{sendEmail(scores);return null;})()}
          </>
        ):null}
      </div>
      <style>{`
        @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
        @keyframes pulse{0%,100%{opacity:0.3;transform:scale(0.8)}50%{opacity:1;transform:scale(1.2)}}
      `}</style>
    </div>
  );

  // ── EMAIL SENT ──
  if(phase==="done_email") return(
    <div style={{...BG,display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh"}}>
      <div ref={topRef}/>
      <div style={{textAlign:"center",padding:"3rem clamp(1rem,4vw,2rem)",animation:"rise 0.6s ease",maxWidth:460,margin:"0 auto"}}>
        <div style={{fontSize:"3.5rem",marginBottom:"1rem"}}>✅</div>
        <h2 style={{color:"#a8d5a2",fontWeight:"normal",fontSize:"clamp(1.1rem,3.5vw,1.5rem)",margin:"0 0 0.75rem"}}>Results sent!</h2>
        <p style={{color:"#78b87a",fontSize:"clamp(0.85rem,2.5vw,1rem)",lineHeight:1.7,marginBottom:"2rem"}}>
          Your full results and personalised tips have been emailed to <strong style={{color:"#a8d5a2"}}>{email}</strong>.<br/>Check your inbox — and keep up the great work! 🌿
        </p>
        <button onClick={()=>setPhase("closed")}
          style={{background:"linear-gradient(135deg,#2d7a4f,#4caf50)",color:"#fff",border:"none",borderRadius:100,padding:"0.9rem clamp(2rem,5vw,2.8rem)",fontSize:"clamp(0.9rem,2.5vw,1rem)",cursor:"pointer",fontFamily:FONT,boxShadow:"0 6px 24px rgba(76,175,80,0.35)",transition:"transform 0.15s",width:"100%",maxWidth:260}}>
          Close ✓
        </button>
      </div>
      <style>{`@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}`}</style>
    </div>
  );

  // ── NO EMAIL — confirm checkbox ──
  if(phase==="no_email") return(
    <div style={{...BG,display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh"}}>
      <div ref={topRef}/>
      <div style={{textAlign:"center",padding:"3rem clamp(1rem,4vw,2rem)",animation:"rise 0.6s ease",maxWidth:440,margin:"0 auto"}}>
        <div style={{fontSize:"2.5rem",marginBottom:"1rem"}}>👍</div>
        <h2 style={{color:"#a8d5a2",fontWeight:"normal",fontSize:"clamp(1.1rem,3.5vw,1.4rem)",margin:"0 0 0.75rem"}}>No problem!</h2>
        <p style={{color:"#78b87a",fontSize:"clamp(0.85rem,2.5vw,0.95rem)",lineHeight:1.7,marginBottom:"1.75rem"}}>
          Your results are shown above. Please tick OK below to confirm you're done — thanks for taking the survey! 🌿
        </p>
        <label style={{display:"flex",alignItems:"center",justifyContent:"center",gap:"0.75rem",cursor:"pointer",marginBottom:"1.75rem",fontSize:"clamp(0.9rem,2.5vw,1rem)",color:"#c8e6c8"}}>
          <input type="checkbox" checked={okChecked} onChange={e=>setOkChecked(e.target.checked)}
            style={{width:22,height:22,cursor:"pointer",accentColor:"#4caf50"}}/>
          OK, I'm done with my results
        </label>
        <button onClick={()=>{if(okChecked)setPhase("closed");}} disabled={!okChecked}
          style={{background:okChecked?"linear-gradient(135deg,#2d7a4f,#4caf50)":"rgba(255,255,255,0.07)",color:okChecked?"#fff":"rgba(255,255,255,0.3)",border:"none",borderRadius:100,padding:"0.9rem clamp(2rem,5vw,2.8rem)",fontSize:"clamp(0.9rem,2.5vw,1rem)",cursor:okChecked?"pointer":"not-allowed",fontFamily:FONT,boxShadow:okChecked?"0 6px 24px rgba(76,175,80,0.35)":"none",transition:"all 0.2s",width:"100%",maxWidth:260}}>
          Close ✓
        </button>
      </div>
      <style>{`@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}`}</style>
    </div>
  );

  return null;
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(EcoSurvey));
  </script>
</body>
</html>
